h1 class="post-title">접두사</h1> <p class="post-description">빈출 접두사 22종 · 200문장 (해커스 박보라 응용문제)</p> </header> <article> <link rel="stylesheet" href="/assets/css/toefl.css"> <div class="toefl-container"> <a href="/toefl/" class="toefl-back">← Back to TOEFL</a> <div class="toefl-header"> <div> <span class="toefl-badge" style="background:#e07b39;">접두사</span> <h4 style="margin:0.4rem 0 0; font-weight:700;">빈출 접두사 — Complete the Words</h4> </div> <div class="pe-page-info" id="px-progress"></div> </div> <div class="px-select" id="px-select"></div> <div class="toefl-topic" id="px-meaning"></div> <div class="toefl-controls"> <button class="toefl-btn btn-success" onclick="pxCheck()">✓ Check Answers</button> <button class="toefl-btn btn-outline" onclick="pxReveal()">Show Answers</button> <button class="toefl-btn btn-secondary" onclick="pxReset()">↺ Reset</button> </div> <div class="toefl-passage" id="px-list"></div> <div class="toefl-score" id="px-scoreBox"> <div class="score-row"> <span class="score-label">Score</span> <span class="score-big" id="px-scoreNum">0/10</span> </div> <div class="score-bar-bg"><div class="score-bar-fill" id="px-scoreBar" style="width:0%"></div></div> <p id="px-scoreFeedback" style="margin:0.6rem 0 0; font-size:0.9rem; color:#555;"></p> </div> </div> <script src="/assets/js/toefl-common.js"></script> <script>
let pxData = [], pxIdx = 0;

function renderPrefix(idx) {
  pxIdx = idx;
  const group = pxData[idx];
  document.getElementById('px-meaning').textContent = group.prefix + '  =  ' + group.meaning;
  const list = document.getElementById('px-list');
  list.innerHTML = group.items.map((item, i) =>
    `<div class="px-item" id="px-item-${i}">
       <span class="px-num">${i+1}.</span>
       <span class="px-sentence">${buildLetterBoxes(parseText(item.text), 'px' + i)}</span>
     </div>`
  ).join('');
  document.getElementById('px-scoreBox').classList.remove('show');
  document.querySelectorAll('.px-chip').forEach((c,i) => c.classList.toggle('active', i===idx));
  document.getElementById('px-progress').textContent = `${group.items.length} sentences`;
  attachBoxEvents(list);
}

function buildPrefixChips() {
  document.getElementById('px-select').innerHTML = pxData.map((g,i) =>
    `<button class="px-chip ${i===0?'active':''}" onclick="renderPrefix(${i})">${g.prefix}</button>`
  ).join('');
}

function pxCheck() {
  let correct = 0, total = 0;
  document.querySelectorAll('#px-list .toefl-blank').forEach(span => {
    total++;
    const answer = span.dataset.answer;
    const typed = Array.from(span.querySelectorAll('.letter-box')).map(b=>b.value.toLowerCase()).join('');
    const ok = typed === answer;
    if (ok) correct++;
    span.querySelectorAll('.letter-box').forEach(b => {
      b.classList.toggle('correct', ok); b.classList.toggle('incorrect', !ok);
    });
  });
  const pct = Math.round(correct/total*100);
  document.getElementById('px-scoreNum').textContent = correct+'/'+total;
  document.getElementById('px-scoreBar').style.width = pct+'%';
  document.getElementById('px-scoreFeedback').textContent = scoreMsg(pct);
  document.getElementById('px-scoreBox').classList.add('show');
}

function pxReveal() {
  document.querySelectorAll('#px-list .toefl-blank').forEach(span => {
    const answer = span.dataset.answer;
    span.querySelectorAll('.letter-box').forEach((b,i) => {
      b.value = answer[i]||''; b.classList.add('correct'); b.classList.remove('incorrect');
    });
  });
  pxCheck();
}

function pxReset() { renderPrefix(pxIdx); }

fetch('/assets/json/prefixes.json')
  .then(r => r.json())
  .then(data => { pxData = data; buildPrefixChips(); renderPrefix(0); })
  .catch(() => { document.getElementById('px-list').textContent = 'Failed to load prefixes.'; });
</script> </article> </div> </div> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?v=a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?v=85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?v=2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?v=c15de51d4bb57887caa2c21988d97279"></script> <script defer src="/assets/js/copy_code.js?v=c8a01c11a92744d44b093fc3bda915df" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab.js?v=d9f17b6adc2311cbabd747f4538bb15f"></script> <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script> <script async src="https://badge.dimensions.ai/badge.js"></script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=" crossorigin="anonymous"></script> <script src="/assets/js/mathjax-setup.js?
