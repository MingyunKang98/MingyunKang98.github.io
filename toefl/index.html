h1 class="post-title">TOEFL</h1> <p class="post-description">TOEFL 2026 Reading Task 1 — Complete the Words practice</p> </header> <article> <style>.toefl-container{max-width:820px;margin:0 auto;font-family:inherit}.toefl-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:.75rem}.toefl-badge{background:#4a90e2;color:white;padding:.3rem .8rem;border-radius:20px;font-size:.8rem;font-weight:600;letter-spacing:.5px}.toefl-timer{font-size:1.4rem;font-weight:700;color:#333;font-variant-numeric:tabular-nums}.toefl-timer.warning{color:#e74c3c}.toefl-passage-select{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.25rem}.passage-chip{padding:.3rem .75rem;border-radius:20px;border:2px solid #e0e0e0;background:white;cursor:pointer;font-size:.82rem;font-weight:600;color:#555;transition:all .15s}.passage-chip:hover{border-color:#4a90e2;color:#4a90e2}.passage-chip.active{background:#4a90e2;border-color:#4a90e2;color:white}.toefl-topic{font-size:.82rem;color:#888;margin-bottom:.85rem;font-style:italic}.toefl-controls{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1.25rem}.toefl-btn{padding:.5rem 1.2rem;border:0;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}.toefl-btn:hover{opacity:.85;transform:translateY(-1px)}.toefl-btn:active{transform:translateY(0)}.btn-primary{background:#4a90e2;color:white}.btn-success{background:#27ae60;color:white}.btn-secondary{background:#95a5a6;color:white}.btn-outline{background:white;color:#4a90e2;border:2px solid #4a90e2}.toefl-passage{background:#f8f9fa;border-left:4px solid #4a90e2;border-radius:6px;padding:1.5rem 1.75rem;line-height:2.6;font-size:1.05rem;margin-bottom:1.5rem}.toefl-blank{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;margin:0 1px}.letter-box{display:inline-block;width:26px;height:30px;border:1.5px solid #bbb;border-radius:4px;background:#fff;text-align:center;font-size:1rem;font-family:inherit;font-weight:500;color:#222;outline:0;padding:0;transition:border-color .15s,background .15s;caret-color:transparent}.letter-box:focus{border-color:#4a90e2;background:#eef4fd}.letter-box.correct{border-color:#27ae60;background:#eafaf1;color:#27ae60;font-weight:700}.letter-box.incorrect{border-color:#e74c3c;background:#fdf0ef;color:#e74c3c}.toefl-score{background:white;border:2px solid #e0e0e0;border-radius:8px;padding:1.25rem 1.5rem;display:none;margin-bottom:1.25rem}.toefl-score.show{display:block}.score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}.score-big{font-size:2.5rem;font-weight:800;color:#4a90e2}.score-label{color:#666;font-size:.9rem}.score-bar-bg{background:#e0e0e0;border-radius:10px;height:10px;overflow:hidden;margin-top:.5rem}.score-bar-fill{height:100%;background:linear-gradient(90deg,#4a90e2,#27ae60);border-radius:10px;transition:width .6s ease}</style> <div class="toefl-container"> <div class="toefl-header"> <div> <span class="toefl-badge">TOEFL 2026</span> <h4 style="margin: 0.4rem 0 0; font-weight: 700;">Reading Task 1 — Complete the Words</h4> </div> <div class="toefl-timer" id="timer">03:00</div> </div> <div class="toefl-passage-select" id="passageSelect"></div> <div class="toefl-topic" id="topicLabel"></div> <div class="toefl-controls"> <button class="toefl-btn btn-primary" onclick="startTimer()">▶ Start Timer</button> <button class="toefl-btn btn-success" onclick="checkAnswers()">✓ Check Answers</button> <button class="toefl-btn btn-outline" onclick="revealAll()">Show Answers</button> <button class="toefl-btn btn-secondary" onclick="resetPassage()">↺ Reset</button> </div> <div class="toefl-passage" id="passage"></div> <div class="toefl-score" id="scoreBox"> <div class="score-row"> <span class="score-label">Score</span> <span class="score-big" id="scoreNum">0/10</span> </div> <div class="score-bar-bg"> <div class="score-bar-fill" id="scoreBar" style="width:0%"></div> </div> <p id="scoreFeedback" style="margin:0.6rem 0 0; font-size:0.9rem; color:#555;"></p> </div> </div> <script>
let passages = [];
let currentPassageIdx = 0;
let timerInterval = null;
let secondsLeft = 180;

/* ── Parse passage text ── */
function parsePassage(raw) {
  const parts = [];
  const regex = /([^\[]*)\[([^\]]+)\]/g;
  let last = 0, m;
  while ((m = regex.exec(raw)) !== null) {
    if (m.index > last) parts.push({ type: 'text', value: raw.slice(last, m.index) });
    if (m[1]) parts.push({ type: 'text', value: m[1] });
    parts.push({ type: 'blank', hidden: m[2] });
    last = m.index + m[0].length;
  }
  if (last < raw.length) parts.push({ type: 'text', value: raw.slice(last) });
  return parts;
}

/* ── Build HTML with per-letter boxes ── */
function buildPassageHTML(parts) {
  let html = '';
  let blankIdx = 0;
  for (const p of parts) {
    if (p.type === 'text') {
      html += p.value;
    } else {
      const answer = p.hidden.toLowerCase();
      const boxes = answer.split('').map((ch, pos) =>
        `<input class="letter-box"
          data-blank="${blankIdx}"
          data-pos="${pos}"
          data-len="${answer.length}"
          maxlength="1"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">`
      ).join('');
      html += `<span class="toefl-blank" data-blank="${blankIdx}" data-answer="${answer}">${boxes}</span>`;
      blankIdx++;
    }
  }
  return html;
}

/* ── Attach keyboard events after render ── */
function attachEvents() {
  const boxes = Array.from(document.querySelectorAll('.letter-box'));
  boxes.forEach((box, i) => {
    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace') {
        if (box.value === '' && i > 0) {
          e.preventDefault();
          boxes[i - 1].focus();
          boxes[i - 1].value = '';
        }
      } else if (e.key === 'Tab' || e.key === 'Enter') {
        e.preventDefault();
        // Jump to first box of next blank group
        const curBlank = parseInt(box.dataset.blank);
        const nextFirst = boxes.find(b => parseInt(b.dataset.blank) === curBlank + 1);
        if (nextFirst) nextFirst.focus();
      } else if (e.key === 'ArrowLeft' && i > 0) {
        e.preventDefault(); boxes[i - 1].focus();
      } else if (e.key === 'ArrowRight' && i < boxes.length - 1) {
        e.preventDefault(); boxes[i + 1].focus();
      }
    });

    box.addEventListener('input', () => {
      if (box.value.length === 1 && i < boxes.length - 1) {
        const nextBox = boxes[i + 1];
        // Only auto-advance within same blank group
        if (parseInt(nextBox.dataset.blank) === parseInt(box.dataset.blank)) {
          nextBox.focus();
        }
      }
    });
  });
}

/* ── Render ── */
function renderPassage(idx) {
  resetTimer();
  const p = passages[idx];
  document.getElementById('topicLabel').textContent = 'Topic: ' + p.topic;
  const parts = parsePassage(p.text);
  document.getElementById('passage').innerHTML = buildPassageHTML(parts);
  document.getElementById('scoreBox').classList.remove('show');
  document.querySelectorAll('.passage-chip').forEach((c, i) =>
    c.classList.toggle('active', i === idx));
  attachEvents();
}

function buildChips() {
  document.getElementById('passageSelect').innerHTML = passages.map((p, i) =>
    `<button class="passage-chip ${i===0?'active':''}" onclick="switchPassage(${i})">Passage ${i+1}</button>`
  ).join('');
}

function switchPassage(idx) {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  currentPassageIdx = idx;
  renderPassage(idx);
}

/* ── Check / Reveal ── */
function checkAnswers() {
  let correct = 0;
  document.querySelectorAll('.toefl-blank').forEach(span => {
    const answer = span.dataset.answer;
    const boxes = span.querySelectorAll('.letter-box');
    const typed = Array.from(boxes).map(b => b.value.toLowerCase()).join('');
    const isCorrect = typed === answer;
    if (isCorrect) correct++;
    boxes.forEach(b => {
      b.classList.toggle('correct', isCorrect);
      b.classList.toggle('incorrect', !isCorrect);
    });
  });
  const total = document.querySelectorAll('.toefl-blank').length;
  showScore(correct, total);
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function revealAll() {
  document.querySelectorAll('.toefl-blank').forEach(span => {
    const answer = span.dataset.answer;
    span.querySelectorAll('.letter-box').forEach((b, i) => {
      b.value = answer[i] || '';
      b.classList.add('correct');
      b.classList.remove('incorrect');
    });
  });
  const total = document.querySelectorAll('.toefl-blank').length;
  showScore(total, total);
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function showScore(correct, total) {
  const pct = Math.round(correct / total * 100);
  document.getElementById('scoreNum').textContent = correct + '/' + total;
  document.getElementById('scoreBar').style.width = pct + '%';
  const msgs = [
    [100, 'Perfect! Excellent vocabulary and spelling.'],
    [80,  'Great job! Review the missed words.'],
    [60,  'Good effort. Focus on context clues.'],
    [40,  'Keep practicing! Read the passage carefully.'],
    [0,   'Try again — read the whole passage first.']
  ];
  document.getElementById('scoreFeedback').textContent =
    msgs.find(([k]) => pct >= k)[1];
  document.getElementById('scoreBox').classList.add('show');
}

function resetPassage() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  renderPassage(currentPassageIdx);
}

/* ── Timer ── */
function resetTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  secondsLeft = 180;
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
  const s = (secondsLeft % 60).toString().padStart(2, '0');
  const el = document.getElementById('timer');
  el.textContent = m + ':' + s;
  el.classList.toggle('warning', secondsLeft <= 30);
}

function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => {
    secondsLeft--;
    updateTimerDisplay();
    if (secondsLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      checkAnswers();
    }
  }, 1000);
}

/* ── Load passages ── */
fetch('/assets/json/toefl-passages.json')
  .then(r => r.json())
  .then(data => {
    passages = data;
    buildChips();
    renderPassage(0);
  })
  .catch(() => {
    document.getElementById('passage').textContent =
      'Failed to load passages. Check assets/json/toefl-passages.json';
  });
</script> </article> </div> </div> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?v=a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?v=85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?v=2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?v=c15de51d4bb57887caa2c21988d97279"></script> <script defer src="/assets/js/copy_code.js?v=c8a01c11a92744d44b093fc3bda915df" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab.js?v=d9f17b6adc2311cbabd747f4538bb15f"></script> <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script> <script async src="https://badge.dimensions.ai/badge.js"></script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js" integrity="sha256-MASABpB4tYktI2Oitl4t+78w/lyA+D7b/s9GEP0JOGI=" crossorigin="anonymous"></script> <script src="/assets/js/mathjax-setup.js?
